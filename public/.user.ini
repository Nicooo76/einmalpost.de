; PHP-Einstellungen für einmalpost.
;
; Ein Anhang darf 16 MB groß sein. Als base64url im JSON-Rumpf werden daraus
; rund 22 MB - ohne diese Werte verwirft PHP die Anfrage stillschweigend,
; bevor die Anwendung sie überhaupt sieht.
;
; Diese Datei gehört zur Anwendung und nicht zur Serverkonfiguration: Wer
; einmalpost selbst betreibt, bekommt die passenden Grenzen mit.
;
; PHP liest sie bei FPM alle paar Minuten neu ein (user_ini.cache_ttl).

post_max_size = 32M
memory_limit = 256M

; Nichts hochladen im klassischen Sinn - Anhänge kommen als JSON, nicht als
; multipart. Der Wert bleibt klein, damit dieser Weg gar nicht erst offensteht.
upload_max_filesize = 1M
file_uploads = Off

; Große Anhänge brauchen etwas länger als eine Textnachricht.
max_execution_time = 60
